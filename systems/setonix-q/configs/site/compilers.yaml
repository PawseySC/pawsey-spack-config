compilers:

# ===================================================================
#                        NVIDIA 
# ===================================================================
- compiler:
    spec: nvhpc@25.9
    paths:
      cc: cc
      cxx: CC
      f77: ftn
      fc: ftn
    flags:
      cflags: -O3 --gcc-toolchain=/opt/cray/pe/gcc-native/13/bin/gcc
      cxxflags: -O3 --gcc-toolchain=/opt/cray/pe/gcc-native/13/bin/gcc
      cppflags: -O3 --gcc-toolchain=/opt/cray/pe/gcc-native/13/bin/gcc
      fflags: -O3 --gcc-toolchain=/opt/cray/pe/gcc-native/13/bin/gcc
    operating_system: sles15
    target: aarch64
    modules:
    - PrgEnv-gnu-nvidia
    environment:
      set:
        PE_ENV: "NVIDIA"
        # Keep Rust/cargo build caches off $HOME.
        CARGO_HOME: USER_TEMP_FILES_PREFIX/$PAWSEY_PROJECT/$USER/setonix-q/DATE_TAG/software/$USER/cargo
    extra_rpaths: []

# ===================================================================
#                        GNU
# ===================================================================
- compiler:
    spec: gcc@13.3.1
    paths:
      cc: cc
      cxx: CC
      f77: ftn
      fc: ftn
    flags:
      cflags: -O3
      cxxflags: -O3
      cppflags: -O3
      # Keep package-specific -fallow-argument-mismatch handling local to the
      # packages that need it. Global GNU-only flag conflicts with mixed
      # %gcc/%nvhpc concretization under PrgEnv-gnu-nvidia.
      fflags: -O3
    operating_system: sles15
    target: aarch64
    modules:
    - PrgEnv-gnu
    - gcc-native/13
    - craype
    - craype-arm-grace
    - craype-network-ofi
    - xpmem
    environment:
      set:
        PE_ENV: "GNU"
        # Keep Rust/cargo build caches off $HOME.
        CARGO_HOME: USER_TEMP_FILES_PREFIX/$PAWSEY_PROJECT/$USER/setonix-q/DATE_TAG/software/$USER/cargo
      unset:
        # The cudatoolkit-gnu-nvidia module (loaded by the combined
        # PrgEnv-gnu-nvidia base environment) sets CRAY_CUDATOOLKIT_POST_LINK_OPTS,
        # which the Cray cc/CC/ftn wrappers append to every link line 
        # Unset it so %gcc CPU builds do not pull in the CUDA runtime.
        - CRAY_CUDATOOLKIT_POST_LINK_OPTS
    extra_rpaths: []
