# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
# Commenting as already in packages.yaml ; leaving for reference
#  packages:
#    hdf:
#      variants: ~external-xdr
  definitions:
  - hdf5-set:
    - hdf5@1.14.5
  - adios-set:
    - adios2@2.10.2
  specs:
  - matrix:
    - [$hdf5-set]
    - ['%gcc@13.3.1']
    - [api=v112, api=v110]
    - [+mpi, ~mpi+cxx]
    - [+hl +fortran +szip build_type=Release]
    - [generator=make]
    - [^libaec generator=make]
  - matrix:
    - [$adios-set]
    - ['%gcc@13.3.1']
    - [+python ^python@3.11.6+optimizations+zlib~ssl, ~python]
    - [~hdf5, +hdf5 ^hdf5@1.14.5 +hl +fortran +szip api=v112 build_type=Release generator=make ^libaec generator=make]
    - [+pic]

  view: false
