# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
# Here installing a selection of S3 clients
spack:
  definitions:
  - s3-python-set:
    - awscli@1.29.41
    - py-boto3@1.34.44
  - s3-go-set:
    - rclone@1.72.1
  # add package specs to the `specs` list
  specs:
  - matrix:
    - [$s3-python-set]
    # This Python spec matches with the main Setonix-Q Python installation.
    # However, this probably prevents awscli and py-boto3 from accessing HTTPS
    # endpoints (which includes bothAcacia and AWS). We should revisit this 
    # and the shared Python build to determine whether we can build with +ssl.
    - [^python@3.11.6+optimizations+zlib~ssl]
    - ['%gcc@13.3.1']
  - matrix:
    - [$s3-go-set]
    - ['%gcc@13.3.1']
  view: false
