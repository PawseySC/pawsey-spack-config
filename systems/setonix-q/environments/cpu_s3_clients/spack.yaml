# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
# Here installing a selection of S3 clients
spack:
  definitions:
  - s3-python-set:
    - awscli@1.29.41
    - py-boto3@1.34.44
  - s3-go-set:
    - rclone@1.72.1
  # add package specs to the `specs` list
  specs:
  - matrix:
    - [$s3-python-set]
    # Changed from ~ssl to +ssl here and in the main Python spec
    # as awscli and boto3 require SSL to connect with S3
    # via HTTPS.
    - [^python@3.11.6+optimizations+zlib+ssl]
    - ['%gcc@13.3.1']
  - matrix:
    - [$s3-go-set]
    - ['%gcc@13.3.1']
  view: false
