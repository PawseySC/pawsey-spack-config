spack:
# They are currently buildable,
# because cray-libsci and cray-fftw are not in use (see packages.yaml)
  packages:
    'fftw-api:':
      buildable: true
  definitions:

  - parallel:
    - blaspp@2024.10.26 +cuda cuda_arch=90 build_type=Release ^openblas%gcc ^cmake ~doc~qtgui %gcc
    # hpx is failing to build due to error  >> 1745    "/usr/include/c++/12/bits/stl_pair.h", line 191: error: incomplete type "boost::spirit::info" is not allowed
    - hpx@1.9.1 +cuda cuda_arch=90 +async_mpi malloc=jemalloc max_cpu_count=128 networking=mpi 
      build_type=Release ^boost %gcc ^cmake ~doc~qtgui %gcc ^asio %gcc
    # rather silly kokkos has std=98,11, etc setting cxxstd. BUT all other packages 
    # use the flag cxxstd ... Update in recipes might fix this but for the moment, we fix 
    # this in our repo
    # cxxstd=14 is not a variant in kokkos@3.7.02
    - kokkos@4.7.04 +cuda cuda_arch=90 +hwloc +memkind +numactl +openmp +tuning +wrapper build_type=Release ^cmake ~doc~qtgui %gcc
    # for hpx must explicitly set openmp off 
    - kokkos@4.7.04 +cuda cuda_arch=90 +wrapper +hwloc +memkind +numactl +hpx +hpx_async_dispatch +tuning ~openmp
      build_type=Release ^hpx@1.9.1 +async_mpi max_cpu_count=128 networking=mpi build_type=Release ^cmake ~doc~qtgui %gcc
    - magma@master ~rocm +cuda cuda_arch=90
    # Re-enabled to retry after the kokkos/CUDA-13 nvcc_wrapper (sm_80) fix.
    # Previously slate failed: openmp taskloops not implemented in the cuda
    # compiler, and it needs nvcc/nvc++ for cuda to be enabled.
    - slate@2024.10.29 +cuda cuda_arch=90 build_type=Release
    # Previously: plasma relies on taskloops/openmp not available with cuda 13.0 and gcc 13.3.
    - plasma@23.8.2 build_type=Release ^openblas
    # some heavier numerical library builds
    # Previously: opencv cmake error with cuda (master could not be patched).
    - opencv@4.10.0 +cuda cuda_arch=90 build_type=Release

    # Previously: trilinos@16.0.0 +cuda failed because llvm failed to build with gcc
    # (CMake: imported target "LibXml2::LibXml2" includes non-existent path).
    - trilinos@16.0.0 +cuda cuda_arch=90 +adios2 +openmp +python ^adios2@2.9.2 build_type=Release ^hdf5@1.14.3 build_type=Release ^adios2%gcc ^binder%gcc ^py-mpi4py%gcc ^python-venv%gcc ^llvm%gcc
    # Previously: trilinos@15.1.0 ~cuda failed with /usr/include/stdlib.h: 'stddef.h' file not found.
    - trilinos@15.1.0 ~rocm +adios2 +openmp +python +tpetra +kokkos +zoltan ~cuda ^adios2@2.9.2 build_type=Release
    - trilinos@16.0.0 ~rocm +adios2 +openmp +python +tpetra +kokkos +zoltan ~cuda ^adios2@2.9.2 build_type=Release

  - petsc-set:
    # Previously disabled: unable to configure petsc with trilinos (unclear whether
    # the petsc or trilinos side was at fault). Retrying now that trilinos is back.
    - petsc@3.15.5 +fftw +trilinos +hwloc +openmp +complex ~cuda
    - petsc@3.21.1 +fftw +hwloc +openmp +cuda cuda_arch=90
  specs:
  # Build the GPU numerical libraries with gcc as the host compiler and consume
  # CUDA via the external cuda/13.0 module (configs/site/packages.yaml)
  # Mirrors the quantum environment and avoids the nvhpc (nvc++) failures with 
  # jemalloc, asio, boost and kokkos.
  - matrix:
    - [$parallel]
    - ['%gcc@13.3.1']
    - [^python@3.11.6%gcc@13.3.1]
  view: false
