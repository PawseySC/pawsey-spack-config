spack:
  definitions:
    - bootstrap_packages:
        # GCC remains an external dependency supplied by the Cray environment.
        - python@3.11.6 +optimizations +ssl +zlib target=neoverse_v2 %gcc_compiler
        - reframe@3.12.0 target=neoverse_v2 %gcc_compiler
  specs:
    - matrix:
        - [$bootstrap_packages]
  concretizer:
    unify: true
  view: false
