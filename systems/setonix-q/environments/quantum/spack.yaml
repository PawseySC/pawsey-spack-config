spack:

  packages:
    python:
      require: "@3.11.6 ~ssl +optimizations +zlib %gcc@13.3.1"

    py-numpy:
      require: "@2.1.2"

    py-scipy:
      require: "@1.14.1"

    py-rustworkx:
      require: "@0.15.1"

    py-autograd:
      require: "@1.8.0"

    py-autoray:
      require: "@0.8.4"

    py-conan:
      require: "@1.65.0"

    py-pydantic:
      require: "@2.7.4"

    cuda:
      require: "@13.0.0"

    cuquantum:
      require: "@25.11.1 +mpi %gcc@13.3.1"

    cutensor:
      require: "@2.4.1.4 %gcc@13.3.1"
      buildable: true
      externals: []

  definitions:
  - quantum_libraries:
    - cuquantum@25.11.1 +mpi
  - quantum_python_packages:
    - py-pennylane@0.45.0+cuda+gpu+tensor+mpi cuda_arch=90
      ^py-mpi4py@4.0.1+gtl gtl_backend=cuda gtl_lib_path=/opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3/lib
    - py-qiskit@2.3.0+cuda+mpi cuda_arch=90
      ^py-mpi4py@4.0.1+gtl gtl_backend=cuda gtl_lib_path=/opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3/lib
    - py-qiskit@2.3.0+cuda~mpi cuda_arch=90
    - py-pennylane-qiskit@0.44.0
      ^py-qiskit@2.3.0+cuda~mpi cuda_arch=90
      ^py-pennylane@0.45.0+cuda+gpu+tensor+mpi cuda_arch=90
      ^py-mpi4py@4.0.1+gtl gtl_backend=cuda gtl_lib_path=/opt/cray/pe/mpich/9.1.0/ofi/gnu/12.3/lib

  specs:
  - matrix:
    - [$quantum_libraries]
    - ['%gcc@13.3.1']
  - matrix:
    - [$quantum_python_packages]
    - ['^python@3.11.6+optimizations+zlib~ssl']
    - ['%gcc@13.3.1']

  view: false
