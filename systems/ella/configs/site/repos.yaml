repos:
  # User/project repositories are added by the wrapper when they exist.
  # Pawsey overrides take precedence over the separately versioned builtin repo.
  pawsey_repo: INSTALL_PREFIX/spack/var/spack/repos/pawsey
  builtin:
    git: https://github.com/spack/spack-packages.git
    commit: SPACK_PACKAGES_COMMIT
    destination: INSTALL_PREFIX/spack/var/spack/repos/builtin
