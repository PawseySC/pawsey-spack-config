repos:
# this list is interpreted as a priority list, 
# in that items higher up in the list are inspected first
# and take precedence
#
# This one is for user recipes
  user_repo: /software/projects/$PAWSEY_PROJECT/$USER/setonix/2026.05/spack_repo

# The following is for project-wide recipes
  project_repo: /software/projects/$PAWSEY_PROJECT/setonix/2026.05/spack_repo

# 
# Spack user (Pawsey staff) populates this one with fixed recipes for Setonix
# that are not (yet) in the Spack public repo
  pawsey_repo: /scratch/pawsey0001/ilkhom/2026.05/spack/var/spack/repos/pawsey

  builtin:
    destination: /scratch/pawsey0001/ilkhom/2026.05/spack/var/spack/repos/builtin
